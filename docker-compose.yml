services:
  app:
    # The web app and the server in one image, published from this repository
    # for amd64 and arm64. It answers the whole site on :8080: the pages at /,
    # the API under /api. Pin a release with DOCUSTAMP_VERSION=0.1.0 in .env;
    # to build from this checkout instead, add -f docker-compose.build.yml.
    image: ghcr.io/ophydami/docustamp:${DOCUSTAMP_VERSION:-latest}
    container_name: docustamp-app
    restart: unless-stopped
    volumes:
      # The uploads directory only, not its parent: ./files also holds the
      # password-reset and verification mail templates baked into the image, and
      # a volume over the parent would hide template changes shipped in new images.
      - docustamp-files:/usr/src/app/files/files
    ports:
      # Loopback only: docker writes its own iptables rules, which bypass a host
      # firewall such as ufw, so "8080:8080" would publish the app straight to
      # the internet around Caddy. A production override can drop it entirely.
      - "127.0.0.1:8080:8080"
    depends_on:
      - mongo
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - SERVER_URL=${HOST_URL:-https://localhost:3001}/api/app
      - PUBLIC_URL=${HOST_URL:-https://localhost:3001}
      # Must match the value baked into the web app: docustamp in the published
      # image; a different one needs your own build (docker-compose.build.yml).
      - APP_ID=${APP_ID:-docustamp}
    networks:
      - app-network
  mongo:
    # Pinned to a major. `mongo:latest` meant a redeploy could move the database
    # across a major version, with its own on-disk format, with no change in this
    # repository.
    image: mongo:8
    container_name: docustamp-mongo
    restart: unless-stopped
    volumes:
      - data-volume:/data/db
    ports:
      # Loopback only, and unauthenticated: this database holds every document.
      # A production override should remove the mapping entirely.
      - "127.0.0.1:27018:27017"
    networks:
      app-network:
        # Older env files connect to mongodb://mongo-container:27017; the alias
        # keeps them working. New ones can use mongodb://mongo:27017.
        aliases:
          - mongo-container
  caddy:
    # HTTPS in front of the app: certificates for HOST_URL are issued and
    # renewed automatically.
    image: caddy:2
    container_name: docustamp-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "3001:3001"
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    environment:
      - HOST_URL=${HOST_URL:-localhost:3001}
networks:
  app-network:
    driver: bridge

volumes:
  data-volume:
  caddy_data:
  caddy_config:
  docustamp-files:
