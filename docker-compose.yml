services:
  server:
    # Built from this checkout, so `docker compose up --build` works in a fresh
    # clone. An operator override file can point the context elsewhere.
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: docustamp/server:local
    container_name: docustamp-server
    restart: unless-stopped
    volumes:
      # The uploads directory only, not its parent. @parse/fs-files-adapter
      # writes to ./files/files, while ./files also holds the password-reset and
      # verification mail templates that are baked into the image. Mounting the
      # volume over ./files shadowed those: template edits shipped in new images
      # never reached production, and a volume restored from an old backup made
      # the mail adapter throw ENOENT on every password reset.
      - docustamp-files:/usr/src/app/files/files
    ports:
      # Loopback only: docker writes its own iptables rules, which bypass a host
      # firewall such as ufw, so "8080:8080" published the Parse mount straight
      # to the internet and around Caddy's /api path handling. A production
      # override can drop the mapping entirely.
      - "127.0.0.1:8080:8080"
    depends_on:
      - mongo
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - SERVER_URL=${HOST_URL:-https://localhost:3001}/api/app
      - PUBLIC_URL=${HOST_URL:-https://localhost:3001}
      # The same value is baked into the web app below, so the two always agree.
      - APP_ID=${APP_ID:-docustamp}
    networks:
      - app-network
  mongo:
    # Pinned to a major. `mongo:latest` meant a redeploy could move the database
    # across a major version, with its own on-disk format, with no change in this
    # repository.
    image: mongo:8
    container_name: docustamp-mongo
    restart: unless-stopped
    volumes:
      - data-volume:/data/db
    ports:
      # Loopback only, and unauthenticated: this database holds every document.
      # A production override should remove the mapping entirely.
      - "127.0.0.1:27018:27017"
    networks:
      app-network:
        # Older env files connect to mongodb://mongo-container:27017; the alias
        # keeps them working. New ones can use mongodb://mongo:27017.
        aliases:
          - mongo-container
  client:
    # The frontend (apps/web), static files served by Caddy on :3000.
    build:
      context: ./apps/web
      args:
        VITE_APPID: ${APP_ID:-docustamp}
    image: docustamp/web:local
    container_name: docustamp-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app-network
  caddy:
    image: caddy:2
    container_name: docustamp-caddy
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    environment:
      - HOST_URL=${HOST_URL:-localhost:3001}
networks:
  app-network:
    driver: bridge

volumes:
  data-volume:
  caddy_data:
  caddy_config:
  docustamp-files:
