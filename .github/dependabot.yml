# Dependabot version updates for the two packages that make up the product:
# the web app (apps/web) and the Parse server (apps/server).
#
# Minor and patch updates arrive as one grouped pull request per package each
# week; major updates still come one per pull request, since they can break
# things and deserve a look of their own. @types/node follows the Node.js
# major the images run (node:22), so its major updates are skipped.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/apps/server"
    schedule:
      interval: "weekly"
    groups:
      server-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
