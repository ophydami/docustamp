<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP App test host</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: light-dark(#f4f4f5, #111); color: light-dark(#18181b, #eee); }
      header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; font-size: 12px; border-bottom: 1px solid #8884; }
      header code { opacity: 0.7; }
      main { display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px; }
      #stage { display: flex; justify-content: center; }
      #frame-wrap { background: light-dark(#fff, #181818); border-radius: 16px; border: 1px solid #8884; overflow: hidden; transition: width .2s, height .2s; }
      #frame-wrap.inline { width: min(640px, 100%); }
      #frame-wrap.fullscreen { width: 100%; height: calc(100vh - 80px); }
      #frame-wrap.panel { width: 400px; height: calc(100vh - 80px); }
      iframe { border: 0; width: 100%; height: 100%; display: block; }
      #log { font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; overflow: auto; max-height: calc(100vh - 80px); }
    </style>
  </head>
  <body>
    <header>
      <strong>MCP App test host</strong>
      <code id="info"></code>
    </header>
    <main>
      <div id="stage"><div id="frame-wrap" class="inline"></div></div>
      <div id="log"></div>
    </main>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
